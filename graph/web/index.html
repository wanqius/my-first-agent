<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的智能体</title>
<style>
  :root { --fg:#1f2937; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --bg:#f9fafb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; color:var(--fg); background:var(--bg); }
  .wrap { max-width:720px; margin:0 auto; padding:40px 20px; }
  h1 { font-size:20px; font-weight:500; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:24px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; }
  .row { display:flex; gap:8px; }
  input { flex:1; font-size:15px; padding:11px 12px; border:1px solid var(--line); border-radius:8px; outline:none; }
  input:focus { border-color:var(--accent); }
  button { font-size:15px; padding:11px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .answer { margin-top:18px; white-space:pre-wrap; line-height:1.7; font-size:15px; }
  .meta { margin-top:14px; color:var(--muted); font-size:12px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .chip { background:#f3f4f6; border-radius:999px; padding:2px 9px; }
  .err { color:#b91c1c; }
  .examples { margin-top:16px; font-size:12px; color:var(--muted); }
  .examples button { background:#fff; border:1px solid var(--line); color:var(--fg); font-size:12px; padding:5px 10px; margin:4px 6px 0 0; border-radius:999px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>我的智能体</h1>
  <div class="sub">MCP 工具协议 · 24 条评测用例 · LangGraph 编排</div>
  <div class="card">
    <div class="row">
      <input id="q" placeholder="问点什么，比如：今天几号？" autocomplete="off">
      <button id="go">发送</button>
    </div>
    <div class="examples">
      试试：
      <button data-q="今天几号？">今天几号</button>
      <button data-q="'今天 心情 很好'不含空格有几个字符？">数字符</button>
      <button data-q="今天几号？再数数'人工智能'有几个字（含空格）">多步任务</button>
      <button data-q="今天广州天气怎么样？">该失败</button>
    </div>
    <div id="out"></div>
  </div>
</div>
<script>
const q = document.getElementById('q');
const go = document.getElementById('go');
const out = document.getElementById('out');

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function send(text) {
  if (!text) return;
  go.disabled = true;
  out.innerHTML = '<div class="answer">思考中…</div>';
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text })
    });
    const data = await res.json();
    if (!res.ok) {
      out.innerHTML = '<div class="answer err">请求失败：' + esc(JSON.stringify(data)) + '</div>';
      return;
    }
    const chips = data.calls.length
      ? data.calls.map(function (c) { return '<span class="chip">' + esc(c) + '</span>'; }).join(' ')
      : '<span class="chip">未调用工具</span>';
    out.innerHTML = '<div class="answer">' + esc(data.answer) + '</div>'
      + '<div class="meta">' + chips + '<span>' + data.elapsed_ms + ' ms</span></div>';
  } catch (e) {
    out.innerHTML = '<div class="answer err">连接失败：' + esc(String(e)) + '</div>';
  } finally {
    go.disabled = false;
  }
}

go.onclick = function () { send(q.value.trim()); };
q.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(q.value.trim()); });
document.querySelectorAll('.examples button').forEach(function (b) {
  b.onclick = function () { q.value = b.dataset.q; send(b.dataset.q); };
});
</script>
</body>
</html>
